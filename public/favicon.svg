<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="favCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5323" />
      <stop offset="100%" stop-color="#492709" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a6b41" />
  
  <!-- Sunflower petals in center -->
  <g transform="translate(32, 32)">
    <g fill="#f8b600" stroke="#e09200" stroke-width="0.5">
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(30)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(60)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(90)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(120)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(150)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(180)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(210)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(240)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(270)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(300)" />
      <ellipse cx="0" cy="-18" rx="3.5" ry="8" transform="rotate(330)" />
    </g>
    <!-- Inner petals layer -->
    <g fill="#ffd200">
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(15)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(45)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(75)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(105)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(135)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(165)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(195)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(225)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(255)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(285)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(315)" />
      <ellipse cx="0" cy="-15" rx="2.5" ry="6" transform="rotate(345)" />
    </g>
    <!-- Center seed disc -->
    <circle cx="0" cy="0" r="9" fill="url(#favCore)" stroke="#533215" stroke-width="0.8" />
  </g>
</svg>
